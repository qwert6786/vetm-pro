<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>إنشاء حساب - VETM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background-color: #f0f2f5; }
        .brand-red { color: #C62828; }
        .bg-brand-red { background-color: #C62828; }
        .btn-red { background-color: #C62828; color: #fff; }
        .btn-red:hover { background-color: #B71C1C; }
        .link-red { color: #C62828; }
        .link-red:hover { text-decoration: underline; }
        .input-focus:focus { border-color: #C62828; ring-color: #C62828; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-left: 48px; }
        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 20px;
            user-select: none;
        }
        .toggle-password:hover { color: #333; }
        .error-message {
            color: #C62828;
            font-size: 14px;
            margin-top: 8px;
            display: none;
            padding: 8px 12px;
            background-color: #ffebee;
            border-radius: 8px;
            border-right: 4px solid #C62828;
        }
        .success-message {
            color: #2e7d32;
            font-size: 14px;
            margin-top: 8px;
            display: none;
            padding: 8px 12px;
            background-color: #e8f5e9;
            border-radius: 8px;
            border-right: 4px solid #2e7d32;
        }
    </style>
</head>
<body>

<!-- n.179.1 التحذير القانوني -->
<!--
⚠️ تحذير قانوني: هذا الكود ملكية خاصة لمشروع VETM™. لا يُسمح بنسخه أو إعادة توزيعه أو استخدامه تجارياً دون موافقة خطية مسبقة.
-->

<div class="min-h-screen flex flex-col justify-center items-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 md:p-8">

        <!-- n.179.2 الشعار -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold brand-red">VETM</h1>
            <p class="text-sm text-gray-600 mt-1">انشاء حساب VETM لتتمكن من ادارة بطاقتك المهنية</p>
        </div>

        <!-- n.179.3 نموذج إنشاء الحساب -->
        <form id="signupForm" class="space-y-5">

            <!-- n.179.4 الاسم الثلاثي -->
            <div>
                <label for="fullName" class="block text-sm font-bold text-gray-700 mb-1">الاسم الثلاثي</label>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="مثال: أحمد حسين قاسم" autocomplete="name">
            </div>

            <!-- n.179.5 البريد الإلكتروني -->
            <div>
                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="example@domain.com" autocomplete="email">
            </div>

            <!-- n.179.6 كلمة السر -->
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أدخل كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</span>
                </div>
            </div>

            <!-- n.179.7 تأكيد كلمة السر -->
            <div>
                <label for="confirmPassword" class="block text-sm font-bold text-gray-700 mb-1">تأكيد كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أعد كتابة كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">👁️</span>
                </div>
                <div id="passwordMatchError" class="error-message">⚠️ كلمة السر وتأكيدها غير متطابقين.</div>
            </div>

            <!-- n.179.8 رسالة الخطأ العامة (للبريد المكرر وغيره) -->
            <div id="generalError" class="error-message"></div>

            <!-- n.179.9 زر إرسال الرمز -->
            <button type="button" id="sendCodeBtn"
                    class="w-full py-3 btn-red font-bold text-lg rounded-xl shadow-md hover:shadow-lg transition duration-200">
                إرسال رمز إلى بريدك
            </button>
        </form>

        <!-- n.179.10 الفاصل والروابط السفلية -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-gray-300"></div>
            <div class="w-2 h-2 bg-[#C62828] rounded-full"></div>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <div class="text-center">
            <a href="login.html" class="link-red font-bold text-sm">
                لديك حساب بالفعل؟ سجل الدخول هنا
            </a>
        </div>

        <p class="text-xs text-gray-400 text-center mt-4">
            بإنشاء حساب، أنت توافق على شروط الخدمة وسياسة الخصوصية
        </p>
    </div>
</div>

<!-- n.179.11 جافا سكريبت -->
<script>
    // n.179.12 عنوان الخادم الخلفي
    const API_URL = 'https://script.google.com/macros/s/AKfycbzeT7Ii_N5vdl0SJpXnWVwLaacKEpEMTVMpUsIWulV-z1FGDvzovf8Y8-Nsq81htmKP/exec';

    // n.179.13 دالة الاتصال العامة
    async function callApi(payload) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return response.json();
    }

    // n.179.14 دالة إظهار/إخفاء كلمة السر
    function togglePasswordVisibility(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.parentElement.querySelector('.toggle-password');
        if (field.type === 'password') {
            field.type = 'text';
            icon.textContent = '🙈';
        } else {
            field.type = 'password';
            icon.textContent = '👁️';
        }
    }

    // n.179.15 حدث زر "إرسال رمز إلى بريدك"
    document.getElementById('sendCodeBtn').addEventListener('click', async function() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('passwordMatchError');
        const generalErrorDiv = document.getElementById('generalError');

        // n.179.16 إخفاء أي رسائل خطأ سابقة
        generalErrorDiv.style.display = 'none';

        // n.179.17 التحقق من صحة المدخلات
        if (!fullName || !email || !password || !confirmPassword) {
            generalErrorDiv.textContent = '⚠️ يرجى ملء جميع الحقول.';
            generalErrorDiv.style.display = 'block';
            return;
        }
        if (password !== confirmPassword) {
            errorDiv.style.display = 'block';
            return;
        }
        errorDiv.style.display = 'none';
        if (password.length < 8) {
            generalErrorDiv.textContent = '⚠️ كلمة السر يجب أن تكون 8 أحرف على الأقل.';
            generalErrorDiv.style.display = 'block';
            return;
        }

        // n.179.18 طلب إرسال الرمز إلى الخادم
        const result = await callApi({ action: 'sendVerificationCode', email: email });

        if (result.ok) {
            // n.179.19 تخزين البيانات مؤقتاً للصفحة التالية
            sessionStorage.setItem('tempFullName', fullName);
            sessionStorage.setItem('tempEmail', email);
            sessionStorage.setItem('tempPassword', password);
            // n.179.20 الانتقال إلى صفحة التحقق
            window.location.href = 'verify.html';
        } else {
            // n.179.21 عرض رسالة خطأ مخصصة بناءً على نوع الخطأ
            if (result.error && result.error.includes('email_exists')) {
                generalErrorDiv.textContent = '⚠️ هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر أو تسجيل الدخول.';
            } else {
                generalErrorDiv.textContent = '⚠️ فشل إرسال الرمز: ' + (result.error || 'خطأ غير معروف');
            }
            generalErrorDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
