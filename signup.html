<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>إنشاء حساب - VETM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background-color: #f0f2f5; }
        .brand-red { color: #C62828; }
        .bg-brand-red { background-color: #C62828; }
        .btn-red { background-color: #C62828; color: #fff; }
        .btn-red:hover { background-color: #B71C1C; }
        .link-red { color: #C62828; }
        .link-red:hover { text-decoration: underline; }
        .input-focus:focus { border-color: #C62828; ring-color: #C62828; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-left: 48px; }
        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 20px;
            user-select: none;
        }
        .toggle-password:hover { color: #333; }
        .error-message {
            color: #C62828;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            padding: 6px 10px;
            background-color: #ffebee;
            border-radius: 6px;
            border-right: 3px solid #C62828;
        }
        .success-message {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            padding: 6px 10px;
            background-color: #e8f5e9;
            border-radius: 6px;
            border-right: 3px solid #2e7d32;
        }
        .email-status {
            font-size: 13px;
            margin-top: 4px;
            display: none;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .email-status.success {
            display: block;
            color: #2e7d32;
            background-color: #e8f5e9;
            border-right: 3px solid #2e7d32;
        }
        .email-status.error {
            display: block;
            color: #C62828;
            background-color: #ffebee;
            border-right: 3px solid #C62828;
        }
        .email-status a {
            color: #C62828;
            font-weight: bold;
            text-decoration: underline;
        }
        .email-status a:hover {
            color: #B71C1C;
        }
    </style>
</head>
<body>

<!-- n.185.2 التحذير القانوني -->
<!--
⚠️ تحذير قانوني: هذا الكود ملكية خاصة لمشروع VETM™. لا يُسمح بنسخه أو إعادة توزيعه أو استخدامه تجارياً دون موافقة خطية مسبقة.
-->

<div class="min-h-screen flex flex-col justify-center items-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 md:p-8">

        <!-- n.185.3 الشعار -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold brand-red">VETM</h1>
            <p class="text-sm text-gray-600 mt-1">انشاء حساب VETM لتتمكن من ادارة بطاقتك المهنية</p>
        </div>

        <!-- n.185.4 نموذج إنشاء الحساب -->
        <form id="signupForm" class="space-y-5">

            <!-- n.185.5 الاسم الثلاثي -->
            <div>
                <label for="fullName" class="block text-sm font-bold text-gray-700 mb-1">الاسم الثلاثي</label>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="مثال: أحمد حسين قاسم" autocomplete="name">
            </div>

            <!-- n.185.6 البريد الإلكتروني -->
            <div>
                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="example@domain.com" autocomplete="email">
                <!-- n.185.7 منطقة عرض حالة البريد -->
                <div id="emailStatus" class="email-status"></div>
            </div>

            <!-- n.185.8 كلمة السر -->
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أدخل كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</span>
                </div>
            </div>

            <!-- n.185.9 تأكيد كلمة السر -->
            <div>
                <label for="confirmPassword" class="block text-sm font-bold text-gray-700 mb-1">تأكيد كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أعد كتابة كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">👁️</span>
                </div>
                <div id="passwordMatchError" class="error-message">⚠️ كلمة السر وتأكيدها غير متطابقين.</div>
            </div>

            <!-- n.185.10 رسالة الخطأ العامة -->
            <div id="generalError" class="error-message"></div>

            <!-- n.185.11 زر إرسال الرمز -->
            <button type="button" id="sendCodeBtn"
                    class="w-full py-3 btn-red font-bold text-lg rounded-xl shadow-md hover:shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                إرسال رمز إلى بريدك
            </button>
        </form>

        <!-- n.185.12 الفاصل والروابط السفلية -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-gray-300"></div>
            <div class="w-2 h-2 bg-[#C62828] rounded-full"></div>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <div class="text-center">
            <a href="login.html" class="link-red font-bold text-sm">
                لديك حساب بالفعل؟ سجل الدخول هنا
            </a>
        </div>

        <p class="text-xs text-gray-400 text-center mt-4">
            بإنشاء حساب، أنت توافق على شروط الخدمة وسياسة الخصوصية
        </p>
    </div>
</div>

<!-- n.185.13 جافا سكريبت -->
<script>
    // n.185.14 عنوان الخادم الخلفي
    const API_URL = 'https://script.google.com/macros/s/AKfycbzYO43s9pqmNvjnNe01eNVU7J5AfM1r8N--YxXJYJNhlYW0Qy6JAnjy6cMsDMa2TsRk/exec';

    // n.185.15 دالة الاتصال العامة
    async function callApi(payload) {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return response.json();
    }

    // n.185.16 دالة إظهار/إخفاء كلمة السر
    function togglePasswordVisibility(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.parentElement.querySelector('.toggle-password');
        if (field.type === 'password') {
            field.type = 'text';
            icon.textContent = '🙈';
        } else {
            field.type = 'password';
            icon.textContent = '👁️';
        }
    }

    // n.185.17 عناصر الصفحة
    const emailInput = document.getElementById('email');
    const emailStatus = document.getElementById('emailStatus');
    const sendBtn = document.getElementById('sendCodeBtn');
    const generalError = document.getElementById('generalError');
    const passwordMatchError = document.getElementById('passwordMatchError');
    let emailCheckTimeout = null;

    // n.185.18 دالة التحقق من البريد
    async function checkEmail(email) {
        if (!email || !email.includes('@')) {
            emailStatus.className = 'email-status';
            emailStatus.style.display = 'none';
            sendBtn.disabled = true;
            return;
        }

        try {
            const result = await callApi({ action: 'checkEmail', email: email });
            if (result.exists) {
                // n.185.19 بريد مكرر
                emailStatus.className = 'email-status error';
                emailStatus.innerHTML = `⚠️ هذا البريد مسجل. يمكنك <a href="login.html">تسجيل الدخول</a> أو <a href="reset-password.html">استعادة كلمة السر</a>.`;
                emailStatus.style.display = 'block';
                sendBtn.disabled = true;
                generalError.style.display = 'none';
            } else {
                // n.185.20 بريد متاح
                emailStatus.className = 'email-status success';
                emailStatus.textContent = '✅ البريد متاح.';
                emailStatus.style.display = 'block';
                sendBtn.disabled = false;
                generalError.style.display = 'none';
            }
        } catch (error) {
            // n.185.21 خطأ في الاتصال
            emailStatus.className = 'email-status error';
            emailStatus.textContent = '⚠️ حدث خطأ في التحقق من البريد، حاول مرة أخرى.';
            emailStatus.style.display = 'block';
            sendBtn.disabled = true;
        }
    }

    // n.185.22 حدث كتابة البريد (مع تأخير لتقليل الطلبات)
    emailInput.addEventListener('input', function() {
        clearTimeout(emailCheckTimeout);
        const email = this.value.trim();
        emailCheckTimeout = setTimeout(() => {
            checkEmail(email);
        }, 400);
    });

    // n.185.23 حدث عند مغادرة الحقل
    emailInput.addEventListener('blur', function() {
        const email = this.value.trim();
        if (email && email.includes('@')) {
            clearTimeout(emailCheckTimeout);
            checkEmail(email);
        }
    });

    // n.185.24 حدث زر "إرسال رمز إلى بريدك"
    sendBtn.addEventListener('click', async function() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = emailInput.value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // n.185.25 إخفاء الرسائل السابقة
        generalError.style.display = 'none';
        passwordMatchError.style.display = 'none';

        // n.185.26 التحقق من صحة المدخلات
        if (!fullName || !email || !password || !confirmPassword) {
            generalError.textContent = '⚠️ يرجى ملء جميع الحقول.';
            generalError.style.display = 'block';
            return;
        }
        if (password !== confirmPassword) {
            passwordMatchError.style.display = 'block';
            return;
        }
        if (password.length < 8) {
            generalError.textContent = '⚠️ كلمة السر يجب أن تكون 8 أحرف على الأقل.';
            generalError.style.display = 'block';
            return;
        }

        // n.185.27 طلب إرسال الرمز إلى الخادم
        const result = await callApi({ action: 'sendVerificationCode', email: email });

        if (result.ok) {
            // n.185.28 تخزين البيانات مؤقتاً
            sessionStorage.setItem('tempFullName', fullName);
            sessionStorage.setItem('tempEmail', email);
            sessionStorage.setItem('tempPassword', password);
            // n.185.29 الانتقال إلى صفحة التحقق
            window.location.href = 'verify.html';
        } else {
            // n.185.30 عرض رسالة خطأ
            if (result.error && result.error.includes('email_exists')) {
                generalError.textContent = '⚠️ هذا البريد مسجل بالفعل. يرجى استخدام بريد آخر.';
            } else {
                generalError.textContent = '⚠️ فشل إرسال الرمز: ' + (result.error || 'خطأ غير معروف');
            }
            generalError.style.display = 'block';
        }
    });
</script>

</body>
</html>
