<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>إنشاء حساب - BEFR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { background-color: #f0f2f5; }
        .brand-red { color: #C62828; }
        .bg-brand-red { background-color: #C62828; }
        .btn-red { background-color: #C62828; color: #fff; }
        .btn-red:hover { background-color: #B71C1C; }
        .link-red { color: #C62828; }
        .link-red:hover { text-decoration: underline; }
        .input-focus:focus { border-color: #C62828; ring-color: #C62828; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-left: 48px; }
        .toggle-password {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 20px;
            user-select: none;
        }
        .toggle-password:hover { color: #333; }
        .error-message {
            color: #C62828;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            padding: 6px 10px;
            background-color: #ffebee;
            border-radius: 6px;
            border-right: 3px solid #C62828;
        }
        .success-message {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            padding: 6px 10px;
            background-color: #e8f5e9;
            border-radius: 6px;
            border-right: 3px solid #2e7d32;
        }
    </style>
</head>
<body>

<!-- n.342.1.1 التحذير القانوني -->
<!--
⚠️ تحذير قانوني: هذا الكود ملكية خاصة لمشروع BEFR™. لا يُسمح بنسخه أو إعادة توزيعه أو استخدامه تجارياً دون موافقة خطية مسبقة.
-->

<div class="min-h-screen flex flex-col justify-center items-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 md:p-8">

        <!-- n.342.1.2 الشعار -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold brand-red">BEFR</h1>
            <p class="text-sm text-gray-600 mt-1">انشاء حساب لتتمكن من ادارة بطاقتك المهنية</p>
        </div>

        <!-- n.342.1.3 نموذج إنشاء الحساب -->
        <form id="signupForm" class="space-y-5">

            <!-- n.342.1.4 الاسم الثلاثي -->
            <div>
                <label for="fullName" class="block text-sm font-bold text-gray-700 mb-1">الاسم الثلاثي</label>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="مثال: أحمد حسين قاسم" autocomplete="name">
            </div>

            <!-- n.342.1.5 البريد الإلكتروني -->
            <div>
                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                       placeholder="example@domain.com" autocomplete="email">
            </div>

            <!-- n.342.1.6 كلمة السر -->
            <div>
                <label for="password" class="block text-sm font-bold text-gray-700 mb-1">كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أدخل كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</span>
                </div>
            </div>

            <!-- n.342.1.7 تأكيد كلمة السر -->
            <div>
                <label for="confirmPassword" class="block text-sm font-bold text-gray-700 mb-1">تأكيد كلمة السر</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#C62828] focus:border-transparent transition"
                           placeholder="أعد كتابة كلمة السر" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">👁️</span>
                </div>
                <div id="passwordMatchError" class="error-message">⚠️ كلمة السر وتأكيدها غير متطابقين.</div>
            </div>

            <!-- n.342.1.8 رسائل الخطأ العامة -->
            <div id="generalError" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- n.342.1.9 زر إنشاء الحساب -->
            <button type="submit" id="signupBtn"
                    class="w-full py-3 btn-red font-bold text-lg rounded-xl shadow-md hover:shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                إنشاء حساب
            </button>
        </form>

        <!-- n.342.1.10 الفاصل والروابط السفلية -->
        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 h-px bg-gray-300"></div>
            <div class="w-2 h-2 bg-[#C62828] rounded-full"></div>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <div class="text-center">
            <a href="login.html" class="link-red font-bold text-sm">
                لديك حساب بالفعل؟ سجل الدخول هنا
            </a>
        </div>

        <p class="text-xs text-gray-400 text-center mt-4">
            بإنشاء حساب، أنت توافق على شروط الخدمة وسياسة الخصوصية
        </p>
    </div>
</div>

<!-- n.342.1.11 Firebase SDK والكود -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"
    }
}
</script>

<script type="module">
    // n.342.1.12 استيراد Firebase
    import { initializeApp } from "firebase/app";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "firebase/auth";

    // n.342.1.13 إعدادات Firebase (استبدل بالقيم الفعلية من Firebase Console)
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBYxorDeKkf0TB_yyFvCjEmW2yCnuiQEvc",
  authDomain: "befr-app.firebaseapp.com",
  projectId: "befr-app",
  storageBucket: "befr-app.firebasestorage.app",
  messagingSenderId: "617082363952",
  appId: "1:617082363952:web:d7cc9365a02f3e23368df5"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

    // n.342.1.14 تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // n.342.1.15 عناصر الصفحة
    const form = document.getElementById('signupForm');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const passwordMatchError = document.getElementById('passwordMatchError');
    const generalError = document.getElementById('generalError');
    const successMessage = document.getElementById('successMessage');
    const signupBtn = document.getElementById('signupBtn');

    // n.342.1.16 دالة إظهار/إخفاء كلمة السر
    window.togglePasswordVisibility = function(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = field.parentElement.querySelector('.toggle-password');
        if (field.type === 'password') {
            field.type = 'text';
            icon.textContent = '🙈';
        } else {
            field.type = 'password';
            icon.textContent = '👁️';
        }
    };

    // n.342.1.17 حدث إرسال النموذج
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // n.342.1.18 إخفاء الرسائل السابقة
        generalError.style.display = 'none';
        successMessage.style.display = 'none';
        passwordMatchError.style.display = 'none';

        // n.342.1.19 جمع البيانات
        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        // n.342.1.20 التحقق من صحة المدخلات
        if (!fullName || !email || !password || !confirmPassword) {
            generalError.textContent = '⚠️ يرجى ملء جميع الحقول.';
            generalError.style.display = 'block';
            return;
        }
        if (password !== confirmPassword) {
            passwordMatchError.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            generalError.textContent = '⚠️ كلمة السر يجب أن تكون 6 أحرف على الأقل.';
            generalError.style.display = 'block';
            return;
        }

        // n.342.1.21 تعطيل الزر أثناء المعالجة
        signupBtn.disabled = true;
        signupBtn.textContent = 'جاري إنشاء الحساب...';

        try {
            // n.342.1.22 إنشاء حساب في Firebase
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // n.342.1.23 إرسال بريد التحقق (اختياري)
            await sendEmailVerification(user);

            // n.342.1.24 عرض رسالة نجاح
            successMessage.textContent = '✅ تم إنشاء الحساب بنجاح! تم إرسال رابط التحقق إلى بريدك.';
            successMessage.style.display = 'block';

            // n.342.1.25 توجيه المستخدم إلى صفحة تسجيل الدخول بعد 2 ثانية
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);

        } catch (error) {
            // n.342.1.26 معالجة أخطاء Firebase
            let errorMessage = '⚠️ فشل إنشاء الحساب: ';
            switch (error.code) {
                case 'auth/email-already-in-use':
                    errorMessage += 'هذا البريد الإلكتروني مسجل بالفعل.';
                    break;
                case 'auth/invalid-email':
                    errorMessage += 'البريد الإلكتروني غير صحيح.';
                    break;
                case 'auth/weak-password':
                    errorMessage += 'كلمة السر ضعيفة (يجب أن تكون 6 أحرف على الأقل).';
                    break;
                default:
                    errorMessage += error.message;
            }
            generalError.textContent = errorMessage;
            generalError.style.display = 'block';
        } finally {
            // n.342.1.27 إعادة تمكين الزر
            signupBtn.disabled = false;
            signupBtn.textContent = 'إنشاء حساب';
        }
    });
</script>

</body>
</html>
